<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALSHANFRICC</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            color: #333;
            position: relative;
            min-height: 100vh;
            background: #000; /* fallback */
            transition: background-image 2s ease-in-out;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Overlay لتعتيم الخلفية */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: -1;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }
        /* الهيدر */
        header {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
        }
        .site-title {
            font-family: 'Playfair Display', 'Cairo', serif;
            font-size: 3.5rem;
            letter-spacing: 3px;
            color: #c48b4c;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
            margin-bottom: 5px;
            transition: 0.3s;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #5a5a5a;
        }
        nav {
            margin-top: 20px;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #444;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 25px;
            transition: 0.3s;
            background: transparent;
        }
        nav a:hover, nav a.active {
            background: #c48b4c;
            color: white;
        }
        /* المحتوى الرئيسي */
        .fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }
        .field-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .field-card:hover { transform: translateY(-5px); }
        .field-card h3 {
            color: #c48b4c;
            margin-bottom: 15px;
            font-size: 1.6rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .field-card p {
            color: #555;
            line-height: 1.8;
        }
        .header-buttons, .body-buttons, .footer-buttons {
            margin: 15px 0;
        }
        .header-buttons button, .body-buttons button, .footer-buttons button {
            background: #c48b4c;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            margin: 5px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #a6733a; }
        footer {
            background: rgba(0,0,0,0.7);
            color: #ccc;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }
        #year {
            cursor: default;
            user-select: none;
        }
        /* لوحة التحكم المخفية */
        #admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            overflow-y: auto;
            padding: 20px;
        }
        .admin-content {
            background: white;
            max-width: 800px;
            margin: 40px auto;
            border-radius: 20px;
            padding: 30px;
            font-family: 'Cairo', sans-serif;
            color: #333;
        }
        .admin-content h2 { color: #c48b4c; margin-bottom: 20px; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .admin-tab {
            background: #f0f0f0;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-tab.active { background: #c48b4c; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .admin-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
        }
        .admin-btn {
            background: #c48b4c;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
        }
        .field-list-item {
            background: #fafafa;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <div id="site-name-display" class="site-title">ALSHANFRICC</div>
        <div id="subtitle-display" class="subtitle"></div>
        <div class="header-buttons" id="header-buttons-area"></div>
        <nav id="nav-links"></nav>
    </div>
</header>

<main class="container">
    <div class="body-buttons" id="body-buttons-area"></div>
    <div id="fields-container" class="fields-grid"></div>
</main>

<footer>
    <div class="footer-buttons" id="footer-buttons-area"></div>
    <p>© <span id="year">2026</span> جميع الحقوق محفوظة</p>
</footer>

<!-- لوحة التحكم المخفية -->
<div id="admin-panel">
    <div class="admin-content">
        <h2>لوحة التحكم</h2>
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="settings">الإعدادات العامة</button>
            <button class="admin-tab" data-tab="fields">إدارة المجالات</button>
            <button class="admin-tab" data-tab="buttons">إدارة الأزرار</button>
        </div>

        <!-- تبويب الإعدادات -->
        <div id="tab-settings" class="tab-content active">
            <label>اسم الموقع</label>
            <input class="admin-input" id="input-site-name" value="ALSHANFRICC">
            <label>النص الفرعي</label>
            <input class="admin-input" id="input-subtitle" value="">
            <label>اللون الأساسي</label>
            <input class="admin-input" type="color" id="input-primary-color" value="#c48b4c">
            <label>نوع الخط (Google Font)</label>
            <select class="admin-input" id="input-font">
                <option value="Cairo">Cairo (عربي)</option>
                <option value="Tajawal">Tajawal</option>
                <option value="Amiri">Amiri</option>
            </select>
            <button class="admin-btn" onclick="saveSettings()">حفظ التغييرات</button>
            <hr style="margin:20px 0">
            <button class="admin-btn" onclick="closeAdmin()">إغلاق اللوحة</button>
        </div>

        <!-- تبويب المجالات -->
        <div id="tab-fields" class="tab-content">
            <h3>إضافة مجال جديد</h3>
            <input class="admin-input" id="field-title" placeholder="اسم المجال">
            <textarea class="admin-input" id="field-content" placeholder="وصف أو محتوى المجال" rows="3"></textarea>
            <button class="admin-btn" onclick="addField()">إضافة</button>
            <div id="fields-list"></div>
        </div>

        <!-- تبويب الأزرار -->
        <div id="tab-buttons" class="tab-content">
            <h3>أزرار الهيدر</h3>
            <textarea class="admin-input" id="header-buttons-code" placeholder="أدخل كود HTML للأزرار" rows="3"></textarea>
            <h3>أزرار البدي</h3>
            <textarea class="admin-input" id="body-buttons-code" placeholder="كود HTML للبدي" rows="3"></textarea>
            <h3>أزرار الفوتر</h3>
            <textarea class="admin-input" id="footer-buttons-code" placeholder="كود HTML للفوتر" rows="3"></textarea>
            <button class="admin-btn" onclick="saveButtons()">حفظ الأزرار</button>
        </div>
    </div>
</div>

<script>
// ========== الثوابت ==========
const TOTAL_IMAGES = 288;
const IMAGE_INTERVAL_MIN = 5; // كل 5 دقائق

// توليد 288 رابط صورة فريدة باستخدام seeds
const natureImages = Array.from({length: TOTAL_IMAGES}, (_, i) =>
    `https://picsum.photos/seed/nature${i+1}/1920/1080`
);

// ========== الخلفية المتغيرة ==========
function getCurrentImageIndex() {
    const now = new Date();
    const minutesSinceMidnight = now.getHours() * 60 + now.getMinutes();
    const intervalIndex = Math.floor(minutesSinceMidnight / IMAGE_INTERVAL_MIN);
    return intervalIndex % TOTAL_IMAGES;
}
function updateBackground() {
    const index = getCurrentImageIndex();
    document.body.style.backgroundImage = `url('${natureImages[index]}')`;
}
updateBackground();
// تحديث الخلفية كل دقيقة للتأكد من التبديل في الوقت المناسب
setInterval(updateBackground, 60000);

// ========== البيانات المخزنة ==========
const STORAGE_KEY = 'alshanfricc_site_data';
function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    // بيانات افتراضية
    return {
        siteName: 'ALSHANFRICC',
        subtitle: '',
        primaryColor: '#c48b4c',
        font: 'Cairo',
        fields: [], // { id, title, content }
        headerButtons: '',
        bodyButtons: '',
        footerButtons: ''
    };
}
function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
let siteData = loadData();

// ========== تطبيق البيانات على الواجهة ==========
function applySettings() {
    document.getElementById('site-name-display').textContent = siteData.siteName;
    document.getElementById('subtitle-display').textContent = siteData.subtitle;
    // تغيير متغير اللون في الـ CSS
    document.documentElement.style.setProperty('--primary-color', siteData.primaryColor);
    document.body.style.fontFamily = siteData.font + ', sans-serif';
    // تحديث الألوان في العناصر
    document.querySelectorAll('.site-title, .field-card h3, .admin-btn, .admin-tab.active, button:not(.admin-tab)').forEach(el => {
        el.style.color = ''; // reset
    });
    // تطبيق اللون كخلفية للأزرار والعناوين النشطة
    const style = document.createElement('style');
    style.id = 'dynamic-colors';
    style.textContent = `
        .site-title, .field-card h3 { color: ${siteData.primaryColor}; }
        .admin-btn, nav a:hover, nav a.active, .header-buttons button, .body-buttons button, .footer-buttons button { background: ${siteData.primaryColor}; }
        .admin-tab.active { background: ${siteData.primaryColor}; }
        button:hover { background: ${adjustColor(siteData.primaryColor, -20)}; }
    `;
    const oldStyle = document.getElementById('dynamic-colors');
    if (oldStyle) oldStyle.remove();
    document.head.appendChild(style);
}
function adjustColor(hex, percent) {
    // دالة بسيطة لتغميق اللون (ليست مثالية لكنها تفي بالغرض)
    let R, G, B;
    if (hex.length === 7) {
        R = parseInt(hex.substring(1,3), 16);
        G = parseInt(hex.substring(3,5), 16);
        B = parseInt(hex.substring(5,7), 16);
    } else return hex;
    R = Math.max(0, R + percent);
    G = Math.max(0, G + percent);
    B = Math.max(0, B + percent);
    return `#${R.toString(16).padStart(2,'0')}${G.toString(16).padStart(2,'0')}${B.toString(16).padStart(2,'0')}`;
}

function renderFields() {
    const container = document.getElementById('fields-container');
    container.innerHTML = '';
    if (siteData.fields.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:white;font-size:1.2rem">لا توجد مجالات بعد. أضف مجالات من لوحة التحكم.</p>';
        return;
    }
    siteData.fields.forEach(field => {
        const card = document.createElement('div');
        card.className = 'field-card';
        card.innerHTML = `<h3>${field.title}</h3><p>${field.content}</p>`;
        container.appendChild(card);
    });
    // تحديث شريط التنقل
    const nav = document.getElementById('nav-links');
    nav.innerHTML = '';
    siteData.fields.forEach(field => {
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = field.title;
        a.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('nav a').forEach(link => link.classList.remove('active'));
            a.classList.add('active');
            // يمكن عمل سكرول للبطاقة المناسبة (اختياري)
        });
        nav.appendChild(a);
    });
}

function renderButtons() {
    document.getElementById('header-buttons-area').innerHTML = siteData.headerButtons;
    document.getElementById('body-buttons-area').innerHTML = siteData.bodyButtons;
    document.getElementById('footer-buttons-area').innerHTML = siteData.footerButtons;
}

function refreshUI() {
    applySettings();
    renderFields();
    renderButtons();
}

// ========== لوحة التحكم ==========
let clickCount = 0;
document.getElementById('year').addEventListener('click', () => {
    clickCount++;
    if (clickCount === 3) {
        openAdmin();
        clickCount = 0;
    }
    setTimeout(() => { clickCount = 0; }, 1000);
});

function openAdmin() {
    document.getElementById('admin-panel').style.display = 'block';
    // ملء الحقول
    document.getElementById('input-site-name').value = siteData.siteName;
    document.getElementById('input-subtitle').value = siteData.subtitle;
    document.getElementById('input-primary-color').value = siteData.primaryColor;
    document.getElementById('input-font').value = siteData.font;
    document.getElementById('header-buttons-code').value = siteData.headerButtons;
    document.getElementById('body-buttons-code').value = siteData.bodyButtons;
    document.getElementById('footer-buttons-code').value = siteData.footerButtons;
    renderAdminFieldsList();
}

function closeAdmin() {
    document.getElementById('admin-panel').style.display = 'none';
}

function saveSettings() {
    siteData.siteName = document.getElementById('input-site-name').value;
    siteData.subtitle = document.getElementById('input-subtitle').value;
    siteData.primaryColor = document.getElementById('input-primary-color').value;
    siteData.font = document.getElementById('input-font').value;
    saveData(siteData);
    refreshUI();
    closeAdmin();
}

// إدارة المجالات
function addField() {
    const title = document.getElementById('field-title').value.trim();
    const content = document.getElementById('field-content').value.trim();
    if (!title) return alert('الرجاء إدخال اسم المجال');
    const newField = {
        id: Date.now().toString(),
        title,
        content
    };
    siteData.fields.push(newField);
    saveData(siteData);
    refreshUI();
    document.getElementById('field-title').value = '';
    document.getElementById('field-content').value = '';
    renderAdminFieldsList();
}

function deleteField(id) {
    siteData.fields = siteData.fields.filter(f => f.id !== id);
    saveData(siteData);
    refreshUI();
    renderAdminFieldsList();
}

function renderAdminFieldsList() {
    const list = document.getElementById('fields-list');
    list.innerHTML = '';
    siteData.fields.forEach(field => {
        const div = document.createElement('div');
        div.className = 'field-list-item';
        div.innerHTML = `<span>${field.title}</span>`;
        const delBtn = document.createElement('button');
        delBtn.textContent = 'حذف';
        delBtn.className = 'admin-btn';
        delBtn.style.background = '#d9534f';
        delBtn.onclick = () => deleteField(field.id);
        div.appendChild(delBtn);
        list.appendChild(div);
    });
}

function saveButtons() {
    siteData.headerButtons = document.getElementById('header-buttons-code').value;
    siteData.bodyButtons = document.getElementById('body-buttons-code').value;
    siteData.footerButtons = document.getElementById('footer-buttons-code').value;
    saveData(siteData);
    refreshUI();
    closeAdmin();
}

// التبويبات داخل لوحة التحكم
document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const target = 'tab-' + tab.dataset.tab;
        document.getElementById(target).classList.add('active');
    });
});

// ========== بدء التطبيق ==========
refreshUI();
</script>
</body>
</html>
